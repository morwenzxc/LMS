<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Meva Salut - Informació</title>

    <style>
        :root {
            --blau: #6aaae4;
            --blau-fosc: #2f6fae;
            --blau-clar: #eaf4fc;
            --gris: #555555;
            --fons: #f5f8fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--fons);
            color: #333333;
            line-height: 1.6;
        }

        /* CAPÇALERA */

        .capcalera {
            background: white;
            border-bottom: 1px solid #dddddd;
        }

        .capcalera-superior {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 30px;
            display: flex;
            align-items: center;
        }

        .logo-ics {
            width: 250px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        .franja-blava {
            height: 12px;
            background: var(--blau);
        }

        .titol-capcalera {
            background: var(--blau);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }

        .titol-capcalera h1 {
            max-width: 1000px;
            margin: 0 auto;
            font-size: 30px;
            line-height: 1.3;
        }

        .subtitol {
            margin-top: 12px;
            font-size: 17px;
            opacity: 0.95;
        }

        /* SELECTOR D'IDIOMA */

        .selector-container {
            max-width: 900px;
            margin: 25px auto 0;
            padding: 0 20px;
        }

        .selector-container label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--blau-fosc);
        }

        select {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--blau);
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        /* CONTINGUT */

        .noticia {
            max-width: 900px;
            margin: 25px auto 40px;
            padding: 0 20px;
        }

        .noticia h2 {
            color: var(--blau-fosc);
            font-size: 26px;
            line-height: 1.3;
            margin-bottom: 25px;
        }

        .noticia h3 {
            color: var(--blau-fosc);
            margin-top: 28px;
            margin-bottom: 10px;
        }

        .noticia p {
            margin: 10px 0;
        }

        .resum {
            background: var(--blau-clar);
            border-left: 5px solid var(--blau);
            padding: 18px 20px;
            margin-top: 30px;
            border-radius: 0 8px 8px 0;
        }

        /* PEU */

        .peu {
            text-align: center;
            color: var(--gris);
            font-size: 13px;
            padding: 20px;
        }

        /* MÒBILS */

        @media (max-width: 600px) {

            .capcalera-superior {
                padding: 15px 20px;
            }

            .logo-ics {
                width: 190px;
            }

            .titol-capcalera {
                padding: 25px 20px;
            }

            .titol-capcalera h1 {
                font-size: 23px;
            }

            .noticia h2 {
                font-size: 22px;
            }

            body {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- CAPÇALERA -->

    <header class="capcalera">

        <div class="capcalera-superior">
            <img src="logo-ics.png"
                 alt="Institut Català de la Salut"
                 class="logo-ics">
        </div>

        <div class="franja-blava"></div>

        <div class="titol-capcalera">
            <h1 id="titol-capcalera"></h1>
            <div class="subtitol" id="subtitol-capcalera"></div>
        </div>

    </header>


    <!-- SELECTOR D'IDIOMA -->

    <main>

        <div class="selector-container">

            <label for="idioma" id="label-idioma">
                Selecciona l'idioma:
            </label>

            <select id="idioma">
                <option value="ca">Català</option>
                <option value="es">Castellano</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="ber">Tamazight</option>
                <option value="ro">Română</option>
            </select>

        </div>


        <!-- NOTÍCIA -->

        <article class="noticia">

            <h2 id="titol"></h2>

            <div id="contingutNoticia"></div>

        </article>

    </main>


    <!-- PEU -->

    <footer class="peu">
        <span id="peu-text"></span>
    </footer>


    <script>

        const continguts = {

            ========================= */

                label: "Selecciona l'idioma:",

                contingut: `
                    <p>El Departament de Salut de Catalunya modificarà progressivament el sistema d'accés a La Meva Salut, substituint les contrasenyes pel sistema d'identificació digital idCAT Mòbil.</p>

                    <h3>1. Substitució progressiva de les contrasenyes</h3>

                    <p>Actualment, els usuaris poden accedir a La Meva Salut mitjançant una contrasenya personal o utilitzant idCAT Mòbil. Salut retirarà progressivament l'opció d'accés mitjançant contrasenya i deixarà idCAT Mòbil com a principal via d'identificació.</p>

                    <p>Aquest canvi respon a la necessitat de reforçar la seguretat i adaptar-se a les normatives europees de protecció de dades.</p>

                    <h3>2. Com funciona l'idCAT Mòbil?</h3>

                    <p>L'idCAT Mòbil no és una aplicació, per tant, no cal descarregar res. És un sistema gratuït d'identificació digital que vincula el document d'identitat de la persona amb el seu número de telèfon mòbil.</p>

                    <p>Per utilitzar-lo, cal donar-se d'alta prèviament. Un cop registrat, per accedir a La Meva Salut només cal introduir el document d'identitat i el telèfon associat. El sistema enviarà un codi d'un sol ús per SMS que s'haurà d'introduir per completar la identificació.</p>

                    <h3>3. Nou sistema d'accés delegat per a familiars</h3>

                    <p>Salut està preparant una funcionalitat que permetrà autoritzar familiars o persones de confiança a gestionar el perfil de La Meva Salut d'una altra persona.</p>

                    <p>La persona autoritzada podrà accedir als perfils dels usuaris que li hagin donat permís des del seu propi compte, sense necessitat de conèixer les seves credencials.</p>

                    <p>Aquesta mesura serà especialment útil per a persones grans o amb dificultats digitals. Actualment, una opció similar ja existeix per a menors i persones tutelades, però es vol ampliar també als adults.</p>

                    <h3>4. Calendari previst</h3>

                    <p>La transició es farà de manera progressiva i està previst que finalitzi a principis de 2027. Fins al gener, els usuaris podran continuar sol·licitant i utilitzant les contrasenyes existents.</p>

                    <div class="resum">
                        <strong>En resum</strong>

                        <p>El principal canvi serà la substitució de les contrasenyes per l'idCAT Mòbil com a sistema d'accés a La Meva Salut.</p>

                    <p>Esta medida será especialmente útil para personas mayores o con dificultades digitales. Actualmente, una opción similar ya existe para menores y personas tuteladas, pero se quiere ampliar también a los adultos.</p>

                    <h3>4. Calendario previsto</h3>

                    <p>To use it, you must register first. Once registered, accessing La Meva Salut only requires entering your identity document and associated phone number. The system will send a one-time code by SMS, which must be entered to complete identification.</p>

                    <p>Pour l'utiliser, il faut d'abord s'inscrire. Une fois inscrit, pour accéder à La Meva Salut, il suffit d'indiquer le document d'identité et le numéro de téléphone associé. Le système enverra un code à usage unique par SMS, qui devra être introduit pour terminer l'identification.</p>

                    </div>

                    <p>Departamentul de Sănătate din Catalonia va modifica treptat sistemul de acces la La Meva Salut, înlocuind parolele cu sistemul de identificare digitală idCAT Mòbil.</p>

                    <h3>1. Înlocuirea treptată a parolelor</h3>

                    <p>În prezent, utilizatorii pot accesa La Meva Salut folosind o parolă personală sau idCAT Mòbil. Departamentul de Sănătate va elimina treptat accesul prin parolă și va utiliza idCAT Mòbil ca principală metodă de identificare.</p>

                    <p>Această schimbare are ca scop consolidarea securității și adaptarea la reglementările europene privind protecția datelor.</p>

                    <h3>2. Cum funcționează idCAT Mòbil?</h3>

                    <p>idCAT Mòbil nu este o aplicație, prin urmare nu trebuie descărcat nimic. Este un sistem gratuit de identificare digitală care asociază documentul de identitate al unei persoane cu numărul său de telefon mobil.</p>

                    <p>Pentru a-l utiliza, trebuie să vă înregistrați în prealabil. După înregistrare, pentru a accesa La Meva Salut trebuie doar să introduceți documentul de identitate și numărul de telefon asociat. Sistemul va trimite prin SMS un cod de unică folosință, care trebuie introdus pentru finalizarea identificării.</p>

                    <h3>3. Noul sistem de acces delegat pentru membrii familiei</h3>

                    <p>Departamentul de Sănătate pregătește o funcționalitate care va permite autorizarea membrilor familiei sau a persoanelor de încredere pentru gestionarea profilului La Meva Salut al unei alte persoane.</p>

                    <p>Persoana autorizată va putea accesa profilurile utilizatorilor care i-au acordat permisiunea din propriul cont, fără a fi nevoie să cunoască parolele acestora.</p>

                    <p>Această măsură va fi deosebit de utilă pentru persoanele în vârstă sau pentru cele care întâmpină dificultăți digitale. În prezent există o opțiune similară pentru minori și persoane aflate sub tutelă, dar se dorește extinderea acesteia și la adulți.</p>

                    <h3>4. Calendarul prevăzut</h3>

                    <p>Tranziția se va realiza treptat și este prevăzut ca aceasta să fie finalizată la începutul anului 2027. Până în ianuarie, utilizatorii vor putea continua să solicite și să utilizeze parolele existente.</p>

                    <div class="resum">
                        <strong>Pe scurt</strong>

                        <p>Principala schimbare va fi înlocuirea parolelor cu idCAT Mòbil ca sistem de acces la La Meva Salut.</p>

                        <p>În paralel, va fi creat un sistem care va facilita gestionarea profilurilor altor utilizatori de către membrii familiei sau persoane de încredere, în special în cazul persoanelor în vârstă.</p>

        /* =========================
           CANVI D'IDIOMA
        ========================= */

        function canviarIdioma() {

            const idiomaSeleccionat =
                document.getElementById("idioma").value;

            const contingut =
                continguts[idiomaSeleccionat];

            if (!contingut) {
                return;
            }

            document.documentElement.lang = idiomaSeleccionat;

            document.getElementById("titol-capcalera").textContent =
                contingut.titol;

            document.getElementById("subtitol-capcalera").textContent =
                contingut.subtitol;

            document.getElementById("label-idioma").textContent =
                contingut.label;

            document.getElementById("titol").textContent =
                contingut.titol;

            document.getElementById("contingutNoticia").innerHTML =
                contingut.contingut;

            document.getElementById("peu-text").textContent =
                contingut.peu;


            /* Text àrab de dreta a esquerra */

            if (idiomaSeleccionat === "ar") {

                document.body.dir = "rtl";

            } else {

                document.body.dir = "ltr";

            }

        }


        /* Quan es canvia l'idioma */

        document.getElementById("idioma").addEventListener(
            "change",
            canviarIdioma
        );


        /* Idioma inicial */

        canviarIdioma();

    </script>
